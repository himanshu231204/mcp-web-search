[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Declared explicitly rather than relying on ruff's defaults. The CI job installs
# ruff unpinned, so when a release widened the default rule set, 30 pre-existing
# findings appeared in files no one had touched and the lint gate went red with
# no code change behind it.
#
# This is ruff's classic default set — the rules this codebase was actually
# developed against. Adopting the broader modern set (I, UP, RUF, BLE, ...) is
# worth doing: it flags real things, including the blind `except Exception`
# handlers tracked in #4 and #7. But that is a repo-wide change touching error
# handling, and it belongs in its own PR rather than riding along with an
# unrelated security fix.
select = ["E4", "E7", "E9", "F"]
